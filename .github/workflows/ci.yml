name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# 같은 ref의 이전 실행은 취소
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Testcontainers는 ubuntu-latest의 Docker를 그대로 사용
      - name: Build & Test
        run: ./gradlew build --no-daemon

      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-present: ignore
